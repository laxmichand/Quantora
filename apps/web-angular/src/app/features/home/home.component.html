<div class="home-page">
  <div class="welcome-section">
    <h1>{{ 'HOME.WELCOME' | translate: { name: userName } }}</h1>
    <p>{{ 'HOME.SUBTITLE' | translate }}</p>
  </div>

  <div class="quick-grid">
    <a class="quick-card" *ngFor="let a of quickActions" [routerLink]="a.route">
      <div class="quick-icon">
        <mat-icon>{{ a.icon }}</mat-icon>
      </div>
      <div class="quick-info">
        <span class="quick-label">{{ a.label | translate }}</span>
        <span class="quick-desc">{{ a.desc | translate }}</span>
      </div>
      <mat-icon class="quick-arrow">chevron_right</mat-icon>
    </a>
  </div>
</div>
