events {
    worker_connections 1024;
}

http {
    # Upstream services
    upstream api_backend {
        server api-nest:3000;
    }

    upstream ai_backend {
        server ai-fastapi:8000;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=ai:10m rate=30r/m;

    server {
        listen 80;
        server_name localhost;

        # ─── Security Headers ─────────────────────────
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://quantora-ih3a.onrender.com https://quantora-ai-633n.onrender.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ─── API Routes ───────────────────────────────
        location /api/ {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ─── AI Service Routes ────────────────────────
        location /ai/ {
            limit_req zone=ai burst=5 nodelay;
            proxy_pass http://ai_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # ─── AI Docs ──────────────────────────────────
        location /docs {
            proxy_pass http://ai_backend;
            proxy_set_header Host $host;
        }

        location /redoc {
            proxy_pass http://ai_backend;
            proxy_set_header Host $host;
        }

        # ─── Health Checks ────────────────────────────
        location /health {
            proxy_pass http://api_backend;
        }

        # ─── Default - Serve Angular ──────────────────
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # ─── Gzip Compression ─────────────────────────
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
        gzip_min_length 1000;
    }
}
