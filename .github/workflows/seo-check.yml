name: SEO Check

on:
  push:
    branches: [main]
    paths:
      - 'apps/web-angular/**'
      - '.lighthouserc.js'
      - 'scripts/seo-check.mjs'
      - '.github/workflows/seo-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/web-angular/**'
      - '.lighthouserc.js'
      - 'scripts/seo-check.mjs'
      - '.github/workflows/seo-check.yml'

env:
  NODE_VERSION: '24'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seo:
    name: Lighthouse + SEO Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install global tools
        run: npm install -g @lhci/cli http-server

      - name: Build Angular app
        run: npx ng build --configuration production
        working-directory: apps/web-angular

      - name: Run Lighthouse CI
        id: lighthouse
        continue-on-error: true
        run: |
          if lhci autorun; then
            echo "lhci_pass=true" >> $GITHUB_OUTPUT
          else
            echo "lhci_pass=false" >> $GITHUB_OUTPUT
          fi
        env:
          LHCI_GITHUB_STATUS: false

      - name: Run SEO checks
        id: seo_checks
        run: node scripts/seo-check.mjs

      - name: Check overall result
        if: always()
        run: |
          FAILED=0
          if [ "${{ steps.lighthouse.outputs.lhci_pass }}" == "false" ]; then
            echo "❌ Lighthouse SEO score is below 90"
            FAILED=1
          fi
          if [ "${{ steps.seo_checks.outcome }}" == "failure" ]; then
            echo "❌ Basic SEO checks failed"
            FAILED=1
          fi
          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi
          echo "✅ All SEO checks passed"

      - name: Upload SEO report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: seo-report
          path: |
            seo-report/
            seo-report.html
          retention-days: 30
