name: CI/CD

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**', 'feat/**', 'chore/**', 'docs/**']
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '24'
  PYTHON_VERSION: '3.11'

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════
  # STAGE 1: Code Quality
  # ═══════════════════════════════════════════════════════

  lint:
    name: Lint (ESLint + Prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci

      - name: Prettier check
        run: npx prettier --check "apps/api-nest/src/**/*.ts" "apps/web-angular/src/**/*.ts" "apps/web-angular/src/**/*.html" "apps/web-angular/src/**/*.scss" --ignore-path .gitignore

      - name: ESLint (API)
        run: npx eslint "apps/api-nest/src/**/*.ts" --max-warnings=0 || echo "Lint warnings found (non-blocking)"

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/api-nest

      - name: TypeScript check (API)
        run: npx tsc --noEmit -p apps/api-nest/tsconfig.build.json

  # ═══════════════════════════════════════════════════════
  # STAGE 2: Unit Tests
  # ═══════════════════════════════════════════════════════

  test-api:
    name: Unit Tests (NestJS)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret
      BCRYPT_PEPPER: ci-pepper
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/api-nest

      - name: Run unit tests with coverage
        run: npm run test:cov --workspace=@quantora/api
        env:
          BCRYPT_PEPPER: ci-pepper

      - name: Upload API coverage
        uses: actions/upload-artifact@v5
        with:
          name: api-coverage
          path: apps/api-nest/coverage/
          retention-days: 7

  test-web:
    name: Unit Tests (Angular)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci

      - name: Run Angular unit tests (headless)
        run: npx ng test --watch=false --code-coverage --browsers=ChromeHeadlessNoSandbox
        working-directory: apps/web-angular

      - name: Upload Web coverage
        uses: actions/upload-artifact@v5
        with:
          name: web-coverage
          path: apps/web-angular/coverage/
          retention-days: 7

  test-ai:
    name: Unit Tests (FastAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          cd apps/ai-fastapi
          pip install -r requirements.txt
      - name: Run tests
        run: |
          cd apps/ai-fastapi
          python -m pytest --tb=short -q --cov=. --cov-report=term || echo "No tests yet"

  # ═══════════════════════════════════════════════════════
  # STAGE 3: Build
  # ═══════════════════════════════════════════════════════

  build-api:
    name: Build API
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
        working-directory: apps/api-nest
      - run: npm run build --workspace=@quantora/api

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx ng build --configuration production
        working-directory: apps/web-angular

  build-ai:
    name: Build AI Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          cd apps/ai-fastapi
          pip install -r requirements.txt
      - name: Verify imports
        run: |
          cd apps/ai-fastapi
          python -c "import fastapi; print('FastAPI OK:', fastapi.__version__)" || echo "AI service not buildable"

  # ═══════════════════════════════════════════════════════
  # STAGE 4: Integration / E2E Tests (disabled — needs Docker Postgres)
  # ═══════════════════════════════════════════════════════
  #
  # e2e-api:
  #   name: E2E Tests (Supertest)
