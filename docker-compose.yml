version: '3.8'

services:
  # Redis - Cache & Sessions
  redis:
    image: redis:7-alpine
    container_name: quantora-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL is hosted on Supabase (cloud)
  # Connection string in .env file

  # MongoDB Atlas is used remotely (no local container needed)
  # Connection string in .env file

  # NestJS Backend
  api-nest:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quantora-api
    ports:
      - '3000:3000'
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/health']
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI AI Service
  ai-fastapi:
    build:
      context: ./apps/ai-fastapi
      dockerfile: Dockerfile
    container_name: quantora-ai
    ports:
      - '8000:8000'
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: quantora-nginx
    ports:
      - '80:80'
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-nest
      - ai-fastapi

volumes:
  redis_data:
