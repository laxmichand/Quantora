# Gitleaks configuration
# https://github.com/gitleaks/gitleaks

[allowlist]
  description = "Global allowlist"
  paths = [
    '''node_modules''',
    '''dist''',
    '''.git''',
    '''coverage''',
    '''package-lock.json''',
    '''.*\.lock''',
    '''docs/.*''',
  ]

  [[allowlist.regex]]
    description = "Prisma examples and placeholders"
    pattern = '''(example|placeholder|xxx|sk-xxx|your-.*-here)'''

  [[allowlist.regex]]
    description = "JWT dev secret"
    pattern = '''quantora-dev-secret'''

  [[allowlist.regex]]
    description = "localhost URLs"
    pattern = '''localhost:\d+'''

  [[allowlist.regex]]
    description = "Test emails"
    pattern = '''test@test\.com'''

[[rules]]
  id = "aws-access-key"
  description = "AWS Access Key"
  regex = '''(AKIA[0-9A-Z]{16})'''
  tags = ["key", "AWS"]

[[rules]]
  id = "aws-secret-key"
  description = "AWS Secret Key"
  regex = '''(?i)aws_secret_access_key\s*[:=]\s*['\"]?([A-Za-z0-9/+=]{40})['\"]?'''
  tags = ["key", "AWS"]

[[rules]]
  id = "github-pat"
  description = "GitHub Personal Access Token"
  regex = '''ghp_[A-Za-z0-9]{36}'''
  tags = ["key", "GitHub"]

[[rules]]
  id = "private-key"
  description = "Private Key"
  regex = '''-----BEGIN (RSA |EC |DSA )?PRIVATE KEY-----'''
  tags = ["key"]

[[rules]]
  id = "jwt-token"
  description = "JWT Token"
  regex = '''eyJ[A-Za-z0-9-_=]+\.eyJ[A-Za-z0-9-_=]+\.[A-Za-z0-9-_.+/=]+'''
  tags = ["token", "JWT"]
  [rules.allowlist]
    description = "Allow test JWTs"
    paths = [
      '''e2e-spec\.ts''',
      '''\.spec\.ts''',
      '''swagger''',
    ]

[[rules]]
  id = "generic-api-key"
  description = "Generic API Key"
  regex = '''(?i)(api[_-]?key|apikey)\s*[:=]\s*['\"]([A-Za-z0-9\-_]{20,})['\"]'''
  tags = ["key", "Generic"]

[[rules]]
  id = "password-in-code"
  description = "Password in code"
  regex = '''(?i)(password|passwd|pwd)\s*[:=]\s*['\"]([^'\" ]{8,})['\"]'''
  tags = ["password"]
  [rules.allowlist]
    description = "Allow test files and docs"
    paths = [
      '''\.spec\.ts''',
      '''\.test\.ts''',
      '''e2e''',
      '''\.md''',
      '''seed\.ts''',
      '''docs/.*''',
    ]
