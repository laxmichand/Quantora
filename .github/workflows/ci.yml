  #         REDIS_URL: redis://localhost:6379

  # ═══════════════════════════════════════════════════════
  # STAGE 5: SEO Checks
  # ═══════════════════════════════════════════════════════

  seo-check:
    name: SEO Check (Lighthouse)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci

      - name: Build Angular app
        run: npx ng build --configuration production
        working-directory: apps/web-angular

      - name: Install global tools
        run: npm install -g @lhci/cli http-server

      - name: Run Lighthouse CI
        id: lighthouse
        continue-on-error: true
        run: |
          if lhci autorun; then
            echo "lhci_pass=true" >> $GITHUB_OUTPUT
          else
            echo "lhci_pass=false" >> $GITHUB_OUTPUT
          fi
        env:
          LHCI_GITHUB_STATUS: false

      - name: Run SEO checks
        id: seo_checks
        run: node scripts/seo-check.mjs

      - name: Check overall result
        if: always()
        run: |
          FAILED=0
          if [ "${{ steps.lighthouse.outputs.lhci_pass }}" == "false" ]; then
            echo "❌ Lighthouse SEO score is below 90"
            FAILED=1
          fi
          if [ "${{ steps.seo_checks.outcome }}" == "failure" ]; then
            echo "❌ Basic SEO checks failed"
            FAILED=1
          fi
          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi
          echo "✅ All SEO checks passed"

      - name: Upload SEO report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: seo-report
          path: |
            seo-report/
            seo-report.html
          retention-days: 30

  # ═══════════════════════════════════════════════════════
  # STAGE 6: Security Scanning
  # ═══════════════════════════════════════════════════════

  security-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: npm audit (critical)
        run: npm audit --audit-level=critical

  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  codeql:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          config: |
            paths:
              - apps/api-nest/src
              - apps/web-angular/src
            paths-ignore:
              - '**/node_modules'
              - '**/dist'
              - '**/*.spec.ts'
              - '**/*.test.ts'
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  hardcoded-secrets:
    name: Hardcoded Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Scan for hardcoded secrets
        run: |
          echo "Scanning source files for hardcoded secrets..."
          FOUND=0
          PATTERNS=(
            'mongodb\+srv://[^"]*:[^"]*@'
            'postgresql://[^"]*:[^"]*@'
            'sk-[A-Za-z0-9]\{20,\}'
          )
          EXCLUDES="--exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git --exclude-dir=coverage --exclude=package-lock.json"

          for pattern in "${PATTERNS[@]}"; do
            MATCHES=$(grep -rn "$pattern" $EXCLUDES \
              --include='*.ts' --include='*.js' --include='*.py' \
              --include='*.yaml' --include='*.yml' \
              . 2>/dev/null || true)
            MATCHES=$(echo "$MATCHES" | grep -v '\.md:' | grep -v '\.example' || true)
            if [ -n "$MATCHES" ]; then
              echo "⚠️  Pattern '$pattern' found:"
              echo "$MATCHES"
              FOUND=1
            fi
          done

          if [ "$FOUND" -eq 1 ]; then
            echo ""
            echo "❌ Hardcoded secrets detected. Use environment variables instead."
            exit 1
          fi
          echo "✅ No hardcoded secrets found"

      - name: Verify .env not committed
        run: |
          ENV_FILES=$(git ls-files | grep -E '\.env$' || true)
          ACTUAL=$(echo "$ENV_FILES" | grep -v '\.env\.example$' || true)
          if [ -n "$ACTUAL" ]; then
            echo "❌ .env files in git: $ACTUAL"
            exit 1
          fi
          echo "✅ No .env files in git"

      - name: Verify .env in .gitignore
        run: |
          if grep -q "^\.env$" .gitignore; then
            echo "✅ .env is gitignored"
          else
            echo "❌ .env not in .gitignore"
            exit 1
          fi

      - name: Verify render.yaml has no secrets
        run: |
          if [ -f render.yaml ]; then
            SECRETS=$(grep -n "value:.*password\|value:.*secret\|value:.*key\|value:.*token" render.yaml 2>/dev/null || true)
            if [ -n "$SECRETS" ]; then
              echo "❌ Secrets in render.yaml: $SECRETS"
              exit 1
            fi
            echo "✅ render.yaml clean"
          fi

  # ═══════════════════════════════════════════════════════
  # STAGE 7: SonarCloud Analysis
  # ═══════════════════════════════════════════════════════

  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate --schema=apps/api-nest/prisma/schema.prisma
      - run: npm run test:cov --workspace=@quantora/api
        env:
          BCRYPT_PEPPER: ci-pepper
      - name: SonarCloud Scan
        continue-on-error: true
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ═══════════════════════════════════════════════════════
  # STAGE 8: Docker Build Verification
  # ═══════════════════════════════════════════════════════

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker image
        run: docker build -t quantora-api:test -f apps/api-nest/Dockerfile .

      - name: Build AI Docker image
        run: docker build -t quantora-ai:test -f apps/ai-fastapi/Dockerfile apps/ai-fastapi

  # ═══════════════════════════════════════════════════════
  # STAGE 9: Summary & Gate
  # ═══════════════════════════════════════════════════════

  ci-summary:
    name: CI Gate
    runs-on: ubuntu-latest
    needs:
      [
        lint,
        test-api,
        test-web,
        test-ai,
        build-api,
        build-web,
        build-ai,
        seo-check,
        sonarcloud,
        security-audit,
        secret-scan,
        codeql,
        hardcoded-secrets,
        docker-build,
      ]
    if: always()
    steps:
      - name: Check all results
        run: |
          echo "═══════════════════════════════════════════"
          echo "           QUANTORA CI/CD RESULTS"
          echo "═══════════════════════════════════════════"
          echo ""
          echo "  Code Quality:"
          echo "    Lint:              ${{ needs.lint.result }}"
          echo ""
          echo "  Unit Tests:"
          echo "    API (Jest):        ${{ needs.test-api.result }}"
          echo "    Web (Karma):       ${{ needs.test-web.result }}"
          echo "    AI (pytest):       ${{ needs.test-ai.result }}"
          echo ""
          echo "  Builds:"
          echo "    API:               ${{ needs.build-api.result }}"
          echo "    Web:               ${{ needs.build-web.result }}"
          echo "    AI:                ${{ needs.build-ai.result }}"
          echo "    Docker:            ${{ needs.docker-build.result }}"
          echo ""
          echo "  Quality:"
          echo "    SEO:               ${{ needs.seo-check.result }}"
          echo "    SonarCloud:        ${{ needs.sonarcloud.result }}"
          echo ""
          echo "  Security:"
          echo "    Dependency Audit:  ${{ needs.security-audit.result }}"
          echo "    Secret Scan:       ${{ needs.secret-scan.result }}"
          echo "    CodeQL:            ${{ needs.codeql.result }}"
          echo "    Hardcoded Scan:    ${{ needs.hardcoded-secrets.result }}"
          echo ""
          echo "═══════════════════════════════════════════"

          FAILED=0
          for result in \
            "${{ needs.lint.result }}" \
            "${{ needs.test-api.result }}" \
            "${{ needs.test-web.result }}" \
            "${{ needs.test-ai.result }}" \
            "${{ needs.build-api.result }}" \
            "${{ needs.build-web.result }}" \
            "${{ needs.build-ai.result }}" \
            "${{ needs.sonarcloud.result }}" \
            "${{ needs.security-audit.result }}" \
            "${{ needs.secret-scan.result }}" \
            "${{ needs.codeql.result }}" \
            "${{ needs.hardcoded-secrets.result }}" \
            "${{ needs.docker-build.result }}"; do
            if [ "$result" == "failure" ] || [ "$result" == "cancelled" ]; then
              FAILED=1
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "❌ CI GATE FAILED — Merge blocked"
            exit 1
          fi

          echo ""
          echo "✅ CI GATE PASSED — All checks green"

  # ═══════════════════════════════════════════════════════
  # STAGE 10: Deploy (triggered only after CI gate passes)
  # ═══════════════════════════════════════════════════════

  deploy-api:
    name: Deploy API (Render)
    runs-on: ubuntu-latest
    needs: [ci-summary]
    if: github.ref == 'refs/heads/main' && needs.ci-summary.result == 'success'
    steps:
      - run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_API }}" ]; then
            curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_API }}"
          else
            echo "RENDER_DEPLOY_HOOK_API not configured, skipping deploy"
          fi

  deploy-web:
    name: Deploy Web (Vercel)
    runs-on: ubuntu-latest
    needs: [ci-summary]
    if: github.ref == 'refs/heads/main' && needs.ci-summary.result == 'success'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ]; then
            npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
          else
            echo "VERCEL_TOKEN not configured, skipping deploy"
          fi
