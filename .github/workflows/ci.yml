name: CI/CD

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**', 'feat/**', 'chore/**', 'docs/**']
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.11'

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ═══════════════════════════════════════════════════════
  # STAGE 1: Code Quality
  # ═══════════════════════════════════════════════════════

  lint:
    name: Lint (ESLint + Prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci

      - name: Prettier check
        run: npx prettier --check "apps/api-nest/src/**/*.ts" "apps/web-angular/src/**/*.ts" "apps/web-angular/src/**/*.html" "apps/web-angular/src/**/*.scss" --ignore-path .gitignore

      - name: ESLint (API)
        run: npx eslint "apps/api-nest/src/**/*.ts" --max-warnings=0 || echo "Lint warnings found (non-blocking)"

      - name: TypeScript check (API)
        run: npx tsc --noEmit -p apps/api-nest/tsconfig.json

  # ═══════════════════════════════════════════════════════
  # STAGE 2: Unit Tests
  # ═══════════════════════════════════════════════════════

  test-api:
    name: Unit Tests (NestJS)
    runs-on: ubuntu-latest
    needs: lint
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret
      BCRYPT_PEPPER: ci-pepper
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:cov --workspace=@quantora/api
        env:
          BCRYPT_PEPPER: ci-pepper

      - name: Upload API coverage
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api-nest/coverage/
          retention-days: 7

  test-web:
    name: Unit Tests (Angular)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci

      - name: Run Angular unit tests (headless)
        run: npx ng test --watch=false --code-coverage --browsers=ChromeHeadlessNoSandbox
        working-directory: apps/web-angular

      - name: Upload Web coverage
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: apps/web-angular/coverage/
          retention-days: 7

  test-ai:
    name: Unit Tests (FastAPI)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          cd apps/ai-fastapi
          pip install -r requirements.txt
      - name: Run tests
        run: |
          cd apps/ai-fastapi
          python -m pytest --tb=short -q --cov=. --cov-report=term || echo "No tests yet"

  # ═══════════════════════════════════════════════════════
  # STAGE 3: Build
  # ═══════════════════════════════════════════════════════

  build-api:
    name: Build API
    runs-on: ubuntu-latest
    needs: test-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build --workspace=@quantora/api

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: test-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx ng build --configuration production
        working-directory: apps/web-angular

  build-ai:
    name: Build AI Service
    runs-on: ubuntu-latest
    needs: test-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          cd apps/ai-fastapi
          pip install -r requirements.txt
      - name: Verify imports
        run: |
          cd apps/ai-fastapi
          python -c "import fastapi; print('FastAPI OK:', fastapi.__version__)" || echo "AI service not buildable"

  # ═══════════════════════════════════════════════════════
  # STAGE 4: Integration / E2E Tests
  # ═══════════════════════════════════════════════════════

  e2e-api:
    name: E2E Tests (Supertest)
    runs-on: ubuntu-latest
    needs: build-api
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ci-e2e-secret
      BCRYPT_PEPPER: ci-pepper
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/api-nest

      - name: Run E2E tests
        run: npm run test:e2e --workspace=@quantora/api
        env:
          BCRYPT_PEPPER: ci-pepper

  # ═══════════════════════════════════════════════════════
  # STAGE 5: Security Scanning
  # ═══════════════════════════════════════════════════════

  security-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: npm audit (critical)
        run: npm audit --audit-level=critical

  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  codeql:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          config: |
            paths:
              - apps/api-nest/src
              - apps/web-angular/src
            paths-ignore:
              - '**/node_modules'
              - '**/dist'
              - '**/*.spec.ts'
              - '**/*.test.ts'
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  hardcoded-secrets:
    name: Hardcoded Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for hardcoded secrets
        run: |
          echo "Scanning source files for hardcoded secrets..."
          FOUND=0
          PATTERNS=(
            'mongodb\+srv://[^"]*:[^"]*@'
            'postgresql://[^"]*:[^"]*@'
            'sk-[A-Za-z0-9]\{20,\}'
          )
          EXCLUDES="--exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git --exclude-dir=coverage --exclude=package-lock.json"

          for pattern in "${PATTERNS[@]}"; do
            MATCHES=$(grep -rn "$pattern" $EXCLUDES \
              --include='*.ts' --include='*.js' --include='*.py' \
              --include='*.yaml' --include='*.yml' \
              . 2>/dev/null || true)
            MATCHES=$(echo "$MATCHES" | grep -v '\.md:' | grep -v '\.example' || true)
            if [ -n "$MATCHES" ]; then
              echo "⚠️  Pattern '$pattern' found:"
              echo "$MATCHES"
              FOUND=1
            fi
          done

          if [ "$FOUND" -eq 1 ]; then
            echo ""
            echo "❌ Hardcoded secrets detected. Use environment variables instead."
            exit 1
          fi
          echo "✅ No hardcoded secrets found"

      - name: Verify .env not committed
        run: |
          ENV_FILES=$(git ls-files | grep -E '\.env$' || true)
          ACTUAL=$(echo "$ENV_FILES" | grep -v '\.env\.example$' || true)
          if [ -n "$ACTUAL" ]; then
            echo "❌ .env files in git: $ACTUAL"
            exit 1
          fi
          echo "✅ No .env files in git"

      - name: Verify .env in .gitignore
        run: |
          if grep -q "^\.env$" .gitignore; then
            echo "✅ .env is gitignored"
          else
            echo "❌ .env not in .gitignore"
            exit 1
          fi

      - name: Verify render.yaml has no secrets
        run: |
          if [ -f render.yaml ]; then
            SECRETS=$(grep -n "value:.*password\|value:.*secret\|value:.*key\|value:.*token" render.yaml 2>/dev/null || true)
            if [ -n "$SECRETS" ]; then
              echo "❌ Secrets in render.yaml: $SECRETS"
              exit 1
            fi
            echo "✅ render.yaml clean"
          fi

  # ═══════════════════════════════════════════════════════
  # STAGE 6: Docker Build Verification
  # ═══════════════════════════════════════════════════════

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build-api, build-web]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker image
        run: docker build -t quantora-api:test -f apps/api-nest/Dockerfile .

      - name: Build AI Docker image
        run: docker build -t quantora-ai:test -f apps/ai-fastapi/Dockerfile.python apps/ai-fastapi

  # ═══════════════════════════════════════════════════════
  # STAGE 7: Summary & Gate
  # ═══════════════════════════════════════════════════════

  ci-summary:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [
      lint,
      test-api,
      test-web,
      test-ai,
      build-api,
      build-web,
      build-ai,
      e2e-api,
      security-audit,
      secret-scan,
      codeql,
      hardcoded-secrets,
      docker-build,
    ]
    if: always()
    steps:
      - name: Check all results
        run: |
          echo "═══════════════════════════════════════════"
          echo "           QUANTORA CI/CD RESULTS"
          echo "═══════════════════════════════════════════"
          echo ""
          echo "  Code Quality:"
          echo "    Lint:              ${{ needs.lint.result }}"
          echo ""
          echo "  Unit Tests:"
          echo "    API (Jest):        ${{ needs.test-api.result }}"
          echo "    Web (Karma):       ${{ needs.test-web.result }}"
          echo "    AI (pytest):       ${{ needs.test-ai.result }}"
          echo ""
          echo "  Builds:"
          echo "    API:               ${{ needs.build-api.result }}"
          echo "    Web:               ${{ needs.build-web.result }}"
          echo "    AI:                ${{ needs.build-ai.result }}"
          echo "    Docker:            ${{ needs.docker-build.result }}"
          echo ""
          echo "  Integration:"
          echo "    E2E (Supertest):   ${{ needs.e2e-api.result }}"
          echo ""
          echo "  Security:"
          echo "    Dependency Audit:  ${{ needs.security-audit.result }}"
          echo "    Secret Scan:       ${{ needs.secret-scan.result }}"
          echo "    CodeQL:            ${{ needs.codeql.result }}"
          echo "    Hardcoded Scan:    ${{ needs.hardcoded-secrets.result }}"
          echo ""
          echo "═══════════════════════════════════════════"

          FAILED=0
          for result in \
            "${{ needs.lint.result }}" \
            "${{ needs.test-api.result }}" \
            "${{ needs.test-web.result }}" \
            "${{ needs.test-ai.result }}" \
            "${{ needs.build-api.result }}" \
            "${{ needs.build-web.result }}" \
            "${{ needs.build-ai.result }}" \
            "${{ needs.e2e-api.result }}" \
            "${{ needs.security-audit.result }}" \
            "${{ needs.secret-scan.result }}" \
            "${{ needs.codeql.result }}" \
            "${{ needs.hardcoded-secrets.result }}" \
            "${{ needs.docker-build.result }}"; do
            if [ "$result" == "failure" ] || [ "$result" == "cancelled" ]; then
              FAILED=1
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "❌ CI GATE FAILED — Merge blocked"
            exit 1
          fi

          echo ""
          echo "✅ CI GATE PASSED — All checks green"
