  #   needs: build-api
  #   services:
  #     postgres:
  #       image: postgres:16-alpine
  #       ports: ['5432:5432']
  #       env:
  #         POSTGRES_USER: postgres
  #         POSTGRES_PASSWORD: postgres
  #         POSTGRES_DB: quantora_test
  #         POSTGRES_HOST_AUTH_METHOD: trust
  #       options: >-
  #         --health-cmd pg_isready
  #         --health-interval 10s
  #         --health-timeout 5s
  #         --health-retries 5
  #     redis:
  #       image: redis:7-alpine
  #       ports: ['6379:6379']
  #       options: >-
  #         --health-cmd "redis-cli ping"
  #         --health-interval 10s
  #         --health-timeout 5s
  #         --health-retries 5
  #   env:
  #     DATABASE_URL: postgresql://postgres@localhost:5432/quantora_test
  #     REDIS_URL: redis://localhost:6379
  #     JWT_SECRET: ci-e2e-secret
  #     BCRYPT_PEPPER: ci-pepper
